<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لتعارفوا NFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: dark navy storefront. Sticky offers bar + nav, hero with product scene, two product cards with galleries and live order summary, how-it-works, FAQ. */
:root{
  --bg:#050d1f; --bg2:#081733; --surface:#0c2147; --surface2:#112b5c;
  --line:rgba(120,170,255,.2); --fg:#eef4ff; --muted:#a9bbdf;
  --blue:#2f8bff; --cyan:#5ad8ff; --hot:#c4163a; --gold:#ffc857; --wa:#25d366; --wa-ink:#04210f;
  --display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;
  background-image:radial-gradient(900px 500px at 50% -120px,rgba(47,139,255,.25),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hot);z-index:60}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.ic{width:1.1em;height:1.1em;flex:none}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.offers{background:var(--hot);color:#fff}
.offers .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;padding-block:6px;font-size:13px;font-weight:700;line-height:1.4}
.offers .ltd{background:var(--gold);color:#1a1200;border-radius:99px;padding:0 10px;font-size:12px;font-weight:700}
.offers button{background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:2px 4px;font-weight:700;font-size:13px;color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.5)}
.offers button:hover{text-decoration-color:#fff}
.nav{background:rgba(5,13,31,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:22px;text-decoration:none;margin-inline-end:auto}
.brand svg{width:26px;height:26px}
.links{display:flex;gap:18px;font-size:14px;font-weight:500}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:#fff}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;height:38px;min-width:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;gap:6px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn.fb{background:#1877f2;border-color:#1877f2;color:#fff}
.iconbtn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
@media (max-width:760px){.links{display:none}}

/* hero */
.hero{padding-block:36px 24px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.5rem,7vw,4.7rem);line-height:1.12;margin:10px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--cyan)}
.lead{font-size:18px;color:var(--muted);max-width:34em;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.wa{background:var(--wa);color:var(--wa-ink);box-shadow:0 8px 28px rgba(37,211,102,.35)}
.btn.fb{background:#1877f2;color:#fff}
.btn .ic{width:1.3em;height:1.3em}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
.pills li{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--muted);background:rgba(255,255,255,.04)}
.pills .ic{color:var(--cyan)}
.hero-art{border-radius:32px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid var(--line);aspect-ratio:1}
.hero-art svg,.stage svg{display:block;width:100%;height:100%}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:520px;margin-inline:auto;width:100%}}

/* sections */
section{padding-block:48px;scroll-margin-top:100px}
.sh{margin-bottom:26px;max-width:40em}
h2{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,4.5vw,2.7rem);line-height:1.25;margin:0 0 8px;text-wrap:balance}
.sh p{margin:0;color:var(--muted);font-size:17px}

/* products */
.prods{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.prods{grid-template-columns:1fr}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:14px;min-width:0}
.gal{position:relative}
.stage{aspect-ratio:1;border-radius:20px;overflow:hidden;touch-action:pan-y}
.nav-b{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(5,13,31,.65);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer}
.nav-b:hover{background:rgba(5,13,31,.9)}
.nav-b.prev{inset-inline-start:10px}.nav-b.next{inset-inline-end:10px}
.nav-b .ic{width:18px;height:18px}
[dir=rtl] .nav-b .ic{transform:scaleX(-1)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.th{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:none;opacity:.65}
.th svg{display:block;width:100%;height:100%}
.th[aria-current=true]{border-color:var(--cyan);opacity:1}
.sale{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:var(--gold);color:#1a1200;font-family:var(--display);font-weight:900;font-size:18px;padding:2px 14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pbody{padding:18px 8px 8px}
.pbody h3{font-family:var(--display);font-weight:900;font-size:26px;margin:0 0 6px;line-height:1.3}
.pbody p{margin:0 0 12px;color:var(--muted)}
.ticks{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.ticks li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.ticks .ic{color:var(--cyan);margin-top:5px}
.price{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.price .now{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.price .cur{font-weight:700;color:var(--muted)}
.price s{color:var(--muted);font-size:20px;font-variant-numeric:tabular-nums;text-decoration-color:var(--hot);text-decoration-thickness:2px}
fieldset{border:0;padding:0;margin:0 0 14px;min-width:0}
legend{font-weight:700;font-size:14px;color:var(--muted);margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-weight:500;font-size:15px}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.qty{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:44px;height:44px;border:0;background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center}
.step button:hover{background:rgba(255,255,255,.14)}
.step output{min-width:48px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.sum{background:var(--bg);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:grid;gap:2px}
.sum .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sum .tot{font-family:var(--display);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.sum .small{font-size:14px;color:var(--muted)}
.sum .save{color:var(--gold);font-weight:700}
.prod .btn{width:100%}
.fine{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}

/* how */
.how{background:var(--bg2);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;padding:0;margin:0}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:8px;justify-items:start}
.steps .s-ic{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--blue),#164fb5);display:grid;place-items:center}
.steps .s-ic svg{width:36px;height:36px}
.steps h3{margin:4px 0 0;font-family:var(--display);font-weight:900;font-size:21px}
.steps p{margin:0;color:var(--muted);font-size:15px}
.note{margin-top:18px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.note .ic{color:var(--cyan)}

/* why */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.feats{grid-template-columns:1fr}}
.feat{padding:20px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface),var(--bg2))}
.feat .ic{width:30px;height:30px;color:var(--cyan)}
.feat h3{font-family:var(--display);font-weight:900;font-size:21px;margin:10px 0 4px}
.feat p{margin:0;color:var(--muted);font-size:15px}
.aud{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.aud span{padding:6px 16px;border-radius:99px;background:var(--surface2);font-weight:500;font-size:15px}

/* faq */
details{border:1px solid var(--line);background:var(--surface);border-radius:16px;margin-bottom:10px}
summary{cursor:pointer;padding:16px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;line-height:1;color:var(--cyan)}
details[open] summary::after{content:"–"}
details p{margin:0;padding:0 18px 16px;color:var(--muted)}
.faq{max-width:760px}

/* final cta */
.final{text-align:center;padding-block:56px}
.final .box{background:linear-gradient(135deg,#143d99,#0a2468 60%,#0b1d4d);border:1px solid var(--line);border-radius:32px;padding:40px 20px}
.final .cta{justify-content:center}
.final h2{margin-bottom:18px}
footer{border-top:1px solid var(--line);padding-block:24px 96px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.float{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px),env(safe-area-inset-left,0px));z-index:40;width:60px;height:60px;border-radius:50%;background:var(--wa);color:var(--wa-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:ping 2.4s infinite}
.float .ic{width:32px;height:32px}
@keyframes ping{0%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 0 rgba(37,211,102,0)}}
.wv{animation:wave 2s infinite;transform-origin:center}
.wv2{animation-delay:.3s}.wv3{animation-delay:.6s}
@keyframes wave{0%,100%{opacity:.25}50%{opacity:1}}
</style>

</head><body>

<main id="top">
<section class="hero"><div class="wrap">
  <div>
    <span class="eyebrow"><svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 1a1 1 0 0 0-1 1v4.586a1 1 0 0 0 .293.707l7 7a1 1 0 0 0 1.414 0l4.586-4.586a1 1 0 0 0 0-1.414l-7-7A1 1 0 0 0 6.586 1zm4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/></svg><span data-i="eyebrow"></span></span>

}};

let lang="ar";
try{const s=localStorage.getItem("lta-lang"); if(s==="en"||s==="ar") lang=s;}catch(e){}
const t=k=>D[lang][k];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=n=>n.toLocaleString("en-US");
const FONT="IBM Plex Sans Arabic, Cairo, sans-serif";

/* ---------- SVG building blocks ---------- */
let uid=0;
function nfcMark(cx,cy,s,color,sw){return `<g transform="translate(${cx} ${cy}) scale(${s}) translate(-12 -12)" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"><path d="M6 8c2.2 2.6 2.2 5.4 0 8"/><path d="M10 5.5c3.6 3.8 3.6 9.2 0 13"/><path d="M14 3c5 5 5 13 0 18"/></g>`}
function shadow(cx,cy,rx,ry,op){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity="${op||.5}" filter="url(#blur)"/>`}
function scene(inner,label){return `<svg viewBox="0 0 600 600" direction="ltr" role="img" aria-label="${label}"><rect width="600" height="600" fill="url(#bgGrad)"/><rect width="600" height="600" fill="url(#keyLight)"/><g filter="url(#blurL)"><circle cx="80" cy="110" r="46" fill="#5ad8ff" opacity=".28"/><circle cx="520" cy="70" r="60" fill="#2f8bff" opacity=".3"/><circle cx="560" cy="300" r="34" fill="#9ad8ff" opacity=".18"/><circle cx="40" cy="380" r="40" fill="#2f8bff" opacity=".22"/></g><rect width="600" height="600" fill="url(#vig)"/>${inner}</svg>`}
function icoBox(name,x,y,size,bg){const sc=size*.56/16, o=(size-16*sc)/2;return `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="${size*.28}" fill="${bg}"/><g transform="translate(${x+o} ${y+o}) scale(${sc})" fill="#fff">${ICO[name]}</g>`}

function card(cx,cy,w,h,rot,face){
  const id="cc"+(++uid), r=w*.06; let body;
  if(face==="front"){
    body=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="url(#cardGrad)"/>
    <g clip-path="url(#${id})">
      <ellipse cx="${w*.02}" cy="${h*.1}" rx="${w*.64}" ry="${h*.3}" transform="rotate(-16 0 0)" fill="none" stroke="#2f8bff" stroke-opacity=".25" stroke-width="${h*.1}"/>
      <ellipse cx="${w*.02}" cy="${h*.1}" rx="${w*.64}" ry="${h*.3}" transform="rotate(-16 0 0)" fill="none" stroke="url(#swirl)" stroke-width="${h*.04}"/>
      <path d="M ${-w/2} ${-h/2} L ${w*.12} ${-h/2} L ${-w*.22} ${h/2} L ${-w/2} ${h/2} Z" fill="#fff" opacity=".07"/>
    </g>
    ${nfcMark(0,-h*.17,h*.3/24,"#5ad8ff",2.3)}
    <text x="0" y="${h*.2+3}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="${h*.21}" fill="#000" opacity=".45">${lang==="ar"?"لتعارفوا":"Lta3arafo"}</text><text x="0" y="${h*.2}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="${h*.21}" fill="#fff">${lang==="ar"?"لتعارفوا":"Lta3arafo"}</text>
    <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>`;
  }else{
    body=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="url(#silver)"/>
    <g clip-path="url(#${id})"><path d="M ${-w/2} ${-h/2} L ${w*.1} ${-h/2} L ${-w*.3} ${h/2} L ${-w/2} ${h/2} Z" fill="#fff" opacity=".5"/></g>
    <circle cx="0" cy="0" r="${h*.3}" fill="none" stroke="#0a2468" stroke-opacity=".18" stroke-width="2"/>
    ${nfcMark(0,0,h*.36/24,"#0a2468",2.2)}
    <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#fff" stroke-width="2"/>`;
  }
  const edge=face==="front"?"#020a1f":"#9aa6c0";
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})"><defs><clipPath id="${id}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}"/></clipPath></defs>${shadow(0,h/2+22,w*.42,13,.55)}<rect x="${-w/2}" y="${-h/2+7}" width="${w}" height="${h}" rx="${r}" fill="${edge}"/>${body}<g clip-path="url(#${id})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="url(#gloss)"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" filter="url(#grain)" opacity=".09"/></g></g>`;
}

function medal(cx,cy,r,gender,rot,face){
  const metal=gender==="girl"?"url(#metalPink)":"url(#metalBlue)", ink=gender==="girl"?"#b53a73":"#1f4fae";
  let inner;
  if(face==="back"){
    inner=`<circle r="${r*.84}" fill="${ink}" opacity=".12"/><circle r="${r*.84}" fill="none" stroke="${ink}" stroke-opacity=".45" stroke-width="2"/>${nfcMark(0,0,r*1.1/24,ink,2.3)}`;
  }else{
    inner=`<circle r="${r*.86}" fill="#dcebff"/><image href="${AV[gender]}" x="${-r*.86}" y="${-r*.86}" width="${r*1.72}" height="${r*1.72}" clip-path="url(#circ)"/><circle r="${r*.86}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>`;
  }
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})">${shadow(0,r+26,r*.8,12,.5)}
  <ellipse cx="0" cy="${-r-44}" rx="15" ry="26" fill="none" stroke="#c9d4ea" stroke-width="5"/><circle cx="0" cy="${-r-14}" r="19" fill="none" stroke="${metal}" stroke-width="9"/>
  <circle r="${r}" fill="${metal}"/><circle r="${r*.93}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  ${inner}
  <circle r="${r}" fill="url(#sheenR)"/><circle r="${r*.86}" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="5"/>
  <ellipse cx="${-r*.28}" cy="${-r*.5}" rx="${r*.46}" ry="${r*.17}" transform="rotate(-35 ${-r*.28} ${-r*.5})" fill="#fff" opacity=".4"/></g>`;
}

function phone(cx,cy,w,h,rot,content,light,sc){
  const sw=w-14, sh=h-14;
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${sc||1})">${shadow(0,h/2+16,w*.45,12,.55)}
  <rect x="${w/2-1}" y="${-h*.2}" width="4" height="${h*.12}" rx="2" fill="#5a6f9c"/><rect x="${-w/2-3}" y="${-h*.28}" width="4" height="${h*.08}" rx="2" fill="#5a6f9c"/><rect x="${-w/2-3}" y="${-h*.17}" width="4" height="${h*.1}" rx="2" fill="#5a6f9c"/>
  <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${w*.16}" fill="#0a0f1d" stroke="url(#phoneEdge)" stroke-width="3.5"/>
  <rect x="${-sw/2}" y="${-sh/2}" width="${sw}" height="${sh}" rx="${w*.12}" fill="url(#${light?"screenLight":"screen"})"/>
  <g transform="translate(0 ${-sh/2})">${content}</g>
  <path d="M ${-sw/2} ${-sh/2} L ${sw*.12} ${-sh/2} L ${-sw*.3} ${sh/2} L ${-sw/2} ${sh/2} Z" fill="#fff" opacity=".06"/>
  <rect x="${-w*.14}" y="${-sh/2+8}" width="${w*.28}" height="9" rx="4.5" fill="#0a0f1d"/></g>`;
}

function waves(cx,cy,rot,n){let s="";for(let i=1;i<=3;i++){const r=26+i*26;s+=`<path class="wv wv${i}" d="M ${-r*.8} ${-r*.6} A ${r} ${r} 0 0 1 ${r*.8} ${-r*.6}" fill="none" stroke="#5ad8ff" stroke-width="7" stroke-linecap="round" transform="translate(${cx} ${cy}) rotate(${rot})"/>`}return s}

function linksScreen(w){
  const S=D[lang].sv, rtl=lang==="ar", sw=w-14, x0=-sw/2+10, bw=sw-20;
  let s=`<circle cx="0" cy="62" r="26" fill="#2f8bff"/><text x="0" y="71" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="26" fill="#fff">${rtl?"أ":"A"}</text>
  <text x="0" y="112" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="14.5" fill="#fff">${S.name}</text>
  <text x="0" y="129" text-anchor="middle" font-family="${FONT}" font-size="11" fill="#a9bbdf">${S.job}</text>`;
  const rows=[["facebook",S.fb,"#1877f2"],["whatsapp","WhatsApp","#25d366"],["credit-card-2-front-fill",S.pay,"#7c3aed"],["wallet2",S.vc,"#e60000"],["cup-hot-fill",S.menu,"#f59e0b"],["linkedin",S.li,"#0a66c2"]];
  rows.forEach((r,i)=>{const y=148+i*42;
    s+=`<rect x="${x0}" y="${y}" width="${bw}" height="36" rx="12" fill="#fff" fill-opacity=".09"/>`;
    const ix=rtl?x0+bw-32:x0+4;
    s+=icoBox(r[0],ix,y+4,28,r[2]);
    s+=`<text x="${rtl?x0+bw-40:x0+40}" y="${y+23}" text-anchor="${rtl?"end":"start"}" font-family="${FONT}" font-weight="500" font-size="13" fill="#fff">${r[1]}</text>`;
  });
  return s;
}
function kidScreen(w,gender,name){
  const S=D[lang].sv, sw=w-14, x0=-sw/2+10, bw=sw-20;
  let s=`<circle cx="0" cy="84" r="46" fill="${gender==="girl"?"#ef76ae":"#2f8bff"}"/><image href="${AV[gender]}" x="-42" y="42" width="84" height="84" clip-path="url(#circ)"/>
  <text x="0" y="158" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="22" fill="#0b1f4d">${name}</text>
  <text x="0" y="178" text-anchor="middle" font-family="${FONT}" font-size="10.5" fill="#4a5f8a">${S.safe}</text>`;
  [["telephone-fill",S.call,"#2f8bff"],["whatsapp",S.wa,"#25d366"],["chat-dots-fill",S.sms,"#f59e0b"]].forEach((r,i)=>{const y=196+i*46;
    s+=`<rect x="${x0}" y="${y}" width="${bw}" height="38" rx="13" fill="${r[2]}"/><g transform="translate(${-bw/2+(lang==="ar"?bw-30:12)} ${y+9}) scale(1.25)" fill="#fff">${ICO[r[0]]}</g><text x="${lang==="ar"?x0+bw-40:x0+40}" y="${y+25}" text-anchor="${lang==="ar"?"end":"start"}" font-family="${FONT}" font-weight="700" font-size="14" fill="#fff">${r[1]}</text>`});
  return s;
}

/* ---------- slides ---------- */
const A=()=>D[lang].alt;
const SL={
 card:[
  ()=>scene(card(300,300,420,264,-9,"front"),A().cardFront),
  ()=>scene(card(300,300,420,264,7,"back"),A().cardBack),
  ()=>scene(card(255,430,330,208,-5,"front")+waves(345,360,18)+phone(385,215,236,470,16,linksScreen(236),false,.82),A().cardTap),
  ()=>scene(phone(300,300,236,470,0,linksScreen(236)),A().cardLinks)
 ],
 kids:[
  ()=>scene(medal(300,330,150,"boy",-6,"front"),A().kidBoy),
  ()=>scene(medal(300,330,150,"girl",6,"front"),A().kidGirl),
  ()=>scene(medal(215,440,105,"boy",-6,"back")+waves(300,380,20)+phone(402,235,196,400,18,kidScreen(196,"boy",D[lang].sv.kid1),true,.96),A().kidTap),
  ()=>scene(phone(200,318,196,400,-5,kidScreen(196,"girl",D[lang].sv.kid2),true)+phone(404,296,196,400,5,kidScreen(196,"boy",D[lang].sv.kid1),true),A().kidPage)
 ]
};
const heroSvg=()=>scene(card(270,270,380,240,-10,"front")+medal(455,445,82,"boy",8,"front")+medal(140,455,68,"girl",-8,"front")+nfcMark(500,120,2.2,"#5ad8ff",1.6),A().hero);

/* ---------- galleries ---------- */
const GI={card:0,kids:0};
function renderGal(k){
  const g=$("#gal-"+k), slides=SL[k];
  $(".stage",g).innerHTML=slides[GI[k]]();
  $(".thumbs",g).innerHTML=slides.map((f,i)=>`<button type="button" class="th" data-i="${i}" aria-label="${i+1}/${slides.length}" ${i===GI[k]?'aria-current="true"':""}>${f()}</button>`).join("");
}
function go(k,i){const n=SL[k].length;GI[k]=(i+n)%n;renderGal(k);}
["card","kids"].forEach(k=>{
  const g=$("#gal-"+k);
  $(".prev",g).onclick=()=>go(k,GI[k]-1);
  $(".next",g).onclick=()=>go(k,GI[k]+1);
  g.addEventListener("click",e=>{const b=e.target.closest(".th");if(b)go(k,+b.dataset.i)});
  let x0=null;const st=$(".stage",g);
  st.addEventListener("pointerdown",e=>{x0=e.clientX});
  st.addEventListener("pointerup",e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40){const rtl=lang==="ar";go(k,GI[k]+((dx<0)!==rtl?1:-1))}});
});

/* ---------- ordering ---------- */
const ST={card:{offer:"none",qty:1},kids:{offer:"none",qty:1,gender:"boy"}};
function calc(k){
  const s=ST[k], p=PRICE[k];
  const unit=s.offer==="student"?STUDENT:p.p;
  const paid=s.offer==="friends"?s.qty-Math.floor(s.qty/3):s.qty;
  return {unit,paid,total:unit*paid,oldTotal:p.old*s.qty};
}
function waLink(text){return `https://wa.me/${WA_NUMBER?WA_NUMBER:""}?text=${encodeURIComponent(text)}`}
function update(k){
  const s=ST[k], c=calc(k), cur=t("cur");
  $("#q-"+k).textContent=s.qty;
  $("#now-"+k).textContent=fmt(s.offer==="student"?STUDENT:PRICE[k].p);
  $$(`.chips[data-k="${k}"]`).forEach(ch=>$$(".chip",ch).forEach(b=>b.setAttribute("aria-pressed",String(ST[k][ch.dataset.g]===b.dataset.v))));
  const saved=c.oldTotal-c.total;
  const note=s.offer==="friends"?`${t("piecesNote").replace("{q}",s.qty)} · ${t("payNote").replace("{n}",s.qty-Math.floor(s.qty/3))}`:"";
  $("#sum-"+k).innerHTML=`<div class="r"><span>${t("total")}</span><span class="tot">${fmt(c.total)} ${cur}</span></div>${note?`<div class="small">${note}</div>`:""}<div class="small">${t("save")} <span class="save">${fmt(saved)} ${cur}</span> <s>${fmt(c.oldTotal)}</s></div>`;
  const lines=[t("m_hi"),`• ${t("m_prod")}: ${t(k==="card"?"m_card":"m_kids")}`];
  if(k==="kids")lines.push(`• ${t("m_pic")}: ${t(s.gender==="boy"?"boy":"girl")}`);
  lines.push(`• ${t("m_qty")}: ${s.qty}`,`• ${t("m_deal")}: ${t("m_"+s.offer)}`,`• ${t("m_total")}: ${fmt(c.total)} ${cur}`);
  $("#wa-"+k).href=waLink(lines.join("\n"));
}
function setQty(k,q){const step=ST[k].offer==="friends"?3:1;ST[k].qty=Math.max(step,Math.min(99,q));update(k)}
$$(".chips").forEach(ch=>ch.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;const k=ch.dataset.k,g=ch.dataset.g;
  ST[k][g]=b.dataset.v;
  if(g==="offer")ST[k].qty=b.dataset.v==="friends"?3:1;
  if(g==="gender"){GI.kids=ST.kids.gender==="boy"?0:1;renderGal("kids")}
  update(k);
}));
$$(".step").forEach(st=>st.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const k=st.dataset.k,step=ST[k].offer==="friends"?3:1;
  setQty(k,ST[k].qty+(+b.dataset.d)*step);
}));
$$("[data-offer]").forEach(b=>b.addEventListener("click",()=>{
  ST.card.offer=b.dataset.offer;ST.card.qty=b.dataset.offer==="friends"?3:1;update("card");
  $("#p-card").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});
}));

/* ---------- language ---------- */
function applyLang(){
  const de=document.documentElement;de.lang=lang;de.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"لتعارفوا NFC":"Lta3arafo NFC";
  $$("[data-i]").forEach(el=>{const v=t(el.dataset.i);if(v!==undefined)el.innerHTML=v});
  $$("[data-ial]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.ial)));
  const lb=$("#langBtn");lb.textContent=t("langBtn");lb.setAttribute("aria-label",t("langAria"));
  $("#aud").innerHTML=t("aud").map(x=>`<span>${x}</span>`).join("");
  $("#heroArt").innerHTML=heroSvg();
  renderGal("card");renderGal("kids");update("card");update("kids");
  const hello=waLink(t("hello"));["waTop","waHero","waFinal","waFoot","waFloat"].forEach(id=>$("#"+id).href=hello);
  ["fbTop","fbHero","fbFinal","fbFoot"].forEach(id=>$("#"+id).href=FB_URL);
}
$("#langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lta-lang",lang)}catch(e){}applyLang()};
applyLang();
</script>

</body></html>
